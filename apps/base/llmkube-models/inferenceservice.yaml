apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: hermes-3-8b
  namespace: llmkube
spec:
  modelRef: hermes-3-8b
  runtime: llamacpp
  replicas: 1
  priority: high
  evictionProtection: true
  contextSize: 131072
  flashAttention: true
  parallelSlots: 1
  resources:
    memory: 24Gi
  jinja: true
  extraArgs:
  - --chat-template-file
  - /etc/llama-templates/hermes3-tool-use.jinja
  extraVolumes:
  - name: hermes-3-8b-tool-template
    configMap:
      name: hermes-3-8b-tool-template
  extraVolumeMounts:
  - name: hermes-3-8b-tool-template
    mountPath: /etc/llama-templates
    readOnly: true