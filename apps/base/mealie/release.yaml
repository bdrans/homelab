apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: mealie
spec:
  interval: 50m
  releaseName: mealie
  chart:
    spec:
      chart: mealie
      version: 1.0.x
      sourceRef:
        kind: HelmRepository
        name: mealie
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      enabled: true
      className: "traefik"
      hosts:
        - host: mealie.bdrans.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - mealie.bdrans.com
          secretName: mealie-cert