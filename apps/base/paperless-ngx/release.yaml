apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
spec:
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: paperless-ngx
  values:
    config:
      PAPERLESS_URL: https://paperless.bdrans.com
      PAPERLESS_TIME_ZONE: America/Denver
    existingSecret:
      name: paperless-ngx-secrets
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      enabled: true
      className: "traefik"
      hosts:
        - host: paperless.bdrans.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - paperless.bdrans.com
          secretName: paperless-cert
    persistence:
      data:
        storageClass: truenas-nfs
      media:
        storageClass: truenas-nfs
      export:
        storageClass: truenas-nfs
      consume:
        storageClass: truenas-nfs
    cnpg:
      storage:
        storageClass: truenas-nfs