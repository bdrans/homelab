apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nfs
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "MainStorage2024"
  datasetPath: "KubernetesStorage"
  compression: "lz4"
  sync: "standard"
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate